<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج التسجيل</title>
  <style>
    body { font-family: Tahoma, sans-serif; text-align: center; padding: 40px; }
    .box { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input, button { width: 90%; padding: 10px; margin: 10px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box">
    <p id="loading">جاري التحقق من حالة النموذج...</p>

    <!-- رسالة الإغلاق -->
    <div id="closedMessage" class="hidden">
      <h2>عذراً، التسجيل مغلق حالياً</h2>
      <p>يرجى المحاولة في وقت لاحق.</p>
    </div>

    <!-- النموذج -->
    <form id="myForm" class="hidden">
      <h2>نموذج التسجيل</h2>
      <input type="text" id="name" placeholder="الاسم الكامل" required>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required>
      <button type="submit" id="submitBtn">إرسال</button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfqnYYlq53wB4MxCefN23KCUU0rBvENjfXOk1kvXoAH6zRPnoO3kIsf_oOc3Z5o56k3g/exec"; // ضع رابط Apps Script هنا

    // فحص حالة النموذج بمجرد فتح الصفحة
    window.onload = async function() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        document.getElementById("loading").classList.add("hidden");

        if (data.status === "OPEN") {
          document.getElementById("myForm").classList.remove("hidden");
        } else {
          document.getElementById("closedMessage").classList.remove("hidden");
        }
      } catch (error) {
        document.getElementById("loading").innerText = "حدث خطأ في الاتصال.";
      }
    };

    // إرسال البيانات
    document.getElementById("myForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value
      };

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.result === "success") {
        alert("تم الإرسال بنجاح!");
        document.getElementById("myForm").reset();
      } else {
        alert("عذراً، تم إغلاق النموذج للتو!");
        location.reload();
      }
      btn.disabled = false;
      btn.innerText = "إرسال";
    });
  </script>

</body>
</html>
