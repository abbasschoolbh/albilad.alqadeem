<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الصف الإلكتروني - مدرسة البلاد القديم الابتدائية الإعدادية للبنين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ce1126; /* أحمر علم مملكة البحرين */
            --primary-dark: #990c1b;
            --secondary: #0f172a;
            --accent: #0284c7;
            --science: #059669;
            --math: #1d4ed8;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.65;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* الهيدر العلوي */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, #7f0916 100%);
            color: white;
            padding: 1.2rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-area span {
            font-size: 0.9rem;
            opacity: 0.95;
            display: block;
            margin-top: 2px;
        }

        .nav-tabs {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 0.55rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.25s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: white;
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1120px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* البطاقات */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 0.7rem;
        }

        /* حقول الإدخال */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1.1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--secondary);
        }

        input, select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #f8fafc;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: white;
        }

        /* أزرار المواد */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.2rem;
        }

        .subject-card {
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .subject-card.math.selected {
            border-color: var(--math);
            background: #eff6ff;
        }

        .subject-card.science.selected {
            border-color: var(--science);
            background: #ecfdf5;
        }

        .subject-icon {
            font-size: 2.8rem;
            margin-bottom: 0.4rem;
        }

        /* تجميع الفصول والدروس */
        .chapter-block {
            margin-bottom: 1.6rem;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
        }

        .chapter-header {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lessons-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 0.9rem;
        }

        .lesson-item {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .lesson-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .lesson-item.active-lesson {
            border-color: var(--primary);
            background: #fff1f2;
        }

        .lesson-status-pill {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            margin-top: 0.5rem;
        }

        .pill-open {
            background: #dcfce7;
            color: var(--success);
        }

        .pill-locked {
            background: #fee2e2;
            color: var(--danger);
        }

        /* شرح الدرس المفصل */
        .lesson-explanation-box {
            background: #f0f9ff;
            border-right: 5px solid var(--accent);
            padding: 1.4rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 1.04rem;
            line-height: 1.8;
        }

        .lesson-explanation-box h4 {
            color: var(--accent);
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }

        .lesson-key-points {
            margin-top: 0.8rem;
            padding-right: 1.2rem;
            color: var(--secondary);
        }

        .lesson-key-points li {
            margin-bottom: 0.35rem;
        }

        /* صندوق النشاط المنفصل */
        .activity-locked-notice {
            background: #fef2f2;
            border: 2px dashed var(--danger);
            border-radius: 14px;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--danger);
            margin-top: 1rem;
        }

        .question-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }

        .question-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
            color: var(--secondary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.6rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: var(--accent);
        }

        .option-label input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* الأزرار */
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.95rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 1
